type: web
name: anniexboda
project: superb-nelli
lang: docker
docker:
  dockerfile: Dockerfile
env:
  OLLAMA_HOST: 0.0.0.0
  OLLAMA_MODELS: /data/ollama
instance_type: h200
regions:
  - was
volumes:
  - id: deepseek_data
    path: /data/ollama
    size: 50
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
health_checks:
  - port: 8000
    path: /health
    interval: 300     # خليناه 300 ثانية (5 دقايق) عشان يلحق يحمل
    timeout: 30       # مهلة الرد 30 ثانية
    restart_limit: 10 # عدد محاولات أكبر قبل القتل
